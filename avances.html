        .grupo-fila {

            flex-wrap: wrap;
            gap: 1.2rem;
            justify-content: flex-start;
            align-items: flex-start;
        }

        .video-container {
            flex: 0 0 auto;
        }

        .video-thumb {
            width: 200px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }

        .video-thumb:hover {
            border-color: rgba(180, 130, 255, 0.5);
            transform: scale(1.02);
            background: rgba(255,255,255,0.05);
        }

        .thumb-img {
            width: 100%;
            height: auto;
            display: block;
            background: #0a0a0a;
        }

        .thumb-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: rgba(0,0,0,0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .thumb-play svg {
            width: 20px;
            height: 20px;
            fill: white;
            margin-left: 2px;
        }

        .video-thumb:hover .thumb-play {
            background: rgba(180, 130, 255, 0.8);
            border-color: white;
            transform: translate(-50%, -50%) scale(1.05);
        }

        .video-player-wrapper {
            margin-top: 0.5rem;
            display: none;
        }

        .video-player-wrapper.active {
            display: block;
        }

        .video-player {
            width: 100%;
            max-width: 400px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        .video-player video {
            width: 100%;
            max-width: 100%;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: #000;
            display: block;
        }

        .video-label {
            font-size: 0.7rem;
            color: #888;
            margin-top: 0.4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 400px;
        }

        .close-video {
            cursor: pointer;
            color: #aaa;
            font-size: 0.7rem;
            background: rgba(255,255,255,0.05);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            transition: all 0.2s;
        }

        .close-video:hover {
            background: rgba(255,255,255,0.15);
            color: white;
        }

        .indice-numero {
            font-size: 0.7rem;
            color: #666;
            margin-top: 0.3rem;
            text-align: center;
        }

        .footer-note {
            margin-top: 3.5rem;
            text-align: center;
            font-size: 0.7rem;
            color: #3a3a3a;
            border-top: 1px solid rgba(255,255,255,0.05);

        }

            body {
                padding: 1.2rem;
            }

            }

<script>
    function setupVideos() {
        const containers = document.querySelectorAll('.video-container');
        
        containers.forEach(container => {
            const thumb = container.querySelector('.video-thumb');
            const wrapper = container.querySelector('.video-player-wrapper');
            const closeBtn = container.querySelector('.close-video');
            const video = container.querySelector('video');
            
            if (!thumb || !wrapper || !closeBtn) return;
            
            thumb.addEventListener('click', (e) => {
                e.stopPropagation();
                
                containers.forEach(other => {
                    const otherWrapper = other.querySelector('.video-player-wrapper');
                    const otherThumb = other.querySelector('.video-thumb');
                    const otherVideo = other.querySelector('video');
                    
                    if (otherWrapper && otherWrapper.classList.contains('active')) {
                        if (otherVideo && !otherVideo.paused) {
                            otherVideo.pause();
                        }
                        otherWrapper.classList.remove('active');
                        if (otherThumb) {
                            otherThumb.style.display = '';
                        }
                    }
                });
                
                wrapper.classList.add('active');
                thumb.style.display = 'none';
                
                if (video) {
                    video.play().catch(e => {
                        console.log("Autoplay bloqueado:", e);
                    });
                }
                
                setTimeout(() => {
                    wrapper.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 50);
            });
            
            closeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (video && !video.paused) {
                    video.pause();
                }
                wrapper.classList.remove('active');
                thumb.style.display = '';
            });
        });
    }
    
    document.addEventListener('DOMContentLoaded', setupVideos);
</script>
