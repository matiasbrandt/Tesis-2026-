<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Referentes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            color: #f0f0f0;
            line-height: 1.4;
            padding: 2rem 1.5rem;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('images/fondito.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            opacity: 0.30;
            pointer-events: none;
            z-index: -1;
            background-attachment: fixed;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .hero {
            text-align: center;
            margin-bottom: 3rem;
            padding: 1.5rem;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: clamp(1.5rem, 5vw, 2rem);
            font-weight: 500;
            background: linear-gradient(135deg, #ffffff 0%, #cccccc 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .back-btn {
            display: inline-block;
            margin-top: 1rem;
            background: rgba(255, 255, 255, 0.08);
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #aaa;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .album-card {
            background: #0a0a0a;
            border-radius: 28px;
            overflow: hidden;
            transition: all 0.35s ease;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
        }

        .album-card:hover {
            transform: translateY(-8px);
            background: #111111;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .album-img {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #030303;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .album-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
            display: block;
        }

        .album-card:hover .album-img img {
            transform: scale(1.02);
        }

        .album-info {
            padding: 1.2rem 1rem 1.4rem 1rem;
            text-align: center;
        }

        .album-title {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 0.2rem;
        }

        .album-sub {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }
            .galeria {
                gap: 1.2rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="hero">
        <h1>Referentes</h1>
        <a href="index.html" class="back-btn">← Volver</a>
    </div>

    <div class="galeria" id="album-grid"></div>
</div>

<script>
    const referentes = [
        {
            nombre: "Norman McLaren",
            subtitulo: "Synchromy (1971)",
            imagen: "https://img.youtube.com/vi/ljXdR_bg-2o/maxresdefault.jpg",
            enlace: "https://www.youtube.com/watch?v=ljXdR_bg-2o"
        },
        {
            nombre: "Oskar Fischinger",
            subtitulo: "An Optical Poem (1938)",
            imagen: "https://img.youtube.com/vi/FcHsysPGSt0/maxresdefault.jpg",
            enlace: "https://www.youtube.com/watch?v=FcHsysPGSt0"
        },
        {
            nombre: "Peter Tscherkassky",
            subtitulo: "Attractions, Instructions and Other Romances",
            imagen: "https://img.youtube.com/vi/XrleK9omuWM/maxresdefault.jpg",
            enlace: "https://www.youtube.com/watch?v=XrleK9omuWM"
        }
    ];

    function cargarGaleria() {
        const grid = document.getElementById("album-grid");
        if (!grid) return;
        grid.innerHTML = "";

        referentes.forEach(ref => {
            const card = document.createElement("div");
            card.className = "album-card";
            card.addEventListener("click", () => {
                window.open(ref.enlace, '_blank');
            });

            const imgContainer = document.createElement("div");
            imgContainer.className = "album-img";
            const img = document.createElement("img");
            img.src = ref.imagen;
            img.alt = ref.nombre;
            img.loading = "lazy";
            img.onerror = function() {
                this.src = "https://img.youtube.com/vi/" + ref.enlace.split('v=')[1] + "/hqdefault.jpg";
            };
            imgContainer.appendChild(img);

            const infoDiv = document.createElement("div");
            infoDiv.className = "album-info";
            const titleSpan = document.createElement("div");
            titleSpan.className = "album-title";
            titleSpan.innerText = ref.nombre;
            const subSpan = document.createElement("div");
            subSpan.className = "album-sub";
            subSpan.innerText = ref.subtitulo;

            infoDiv.appendChild(titleSpan);
            infoDiv.appendChild(subSpan);
            card.appendChild(imgContainer);
            card.appendChild(infoDiv);
            grid.appendChild(card);
        });
    }

    document.addEventListener("DOMContentLoaded", cargarGaleria);
</script>

</body>
</html>
